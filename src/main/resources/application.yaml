spring:
  application:
    name: ai-gen-web-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_gen_web
    username: root
    password: 12345678
  profiles:
    active:
      - local
  session:
    store-type: redis
    # 30 天过期
    timeout: 2592000

  # redis
  data:
    redis:
      host: localhost
      port: 6379
      ttl: 3600
      password:
      database: 0


# AI 模型配置：密钥、地址由 application-local.yaml（或命令行参数）里的 chat-model 提供，
# 推理模型与路由模型默认沿用它们，需要单独指定时直接覆盖对应字段即可。
langchain4j:
  open-ai:
    streaming-chat-model:
      base-url: ${langchain4j.open-ai.chat-model.base-url}
      api-key: ${langchain4j.open-ai.chat-model.api-key}
      model-name: ${langchain4j.open-ai.chat-model.model-name}
    # 推理模型：Vue 工程等复杂代码生成，输出长、需要稳定
    reasoning-streaming-chat-model:
      base-url: ${langchain4j.open-ai.chat-model.base-url}
      api-key: ${langchain4j.open-ai.chat-model.api-key}
      model-name: ${langchain4j.open-ai.chat-model.model-name}
      max-tokens: 32768
      temperature: 0.1
    # 路由模型：只做“选哪种生成方式”的分类，输出很短；可换成更便宜的模型降低成本
    routing-chat-model:
      base-url: ${langchain4j.open-ai.chat-model.base-url}
      api-key: ${langchain4j.open-ai.chat-model.api-key}
      model-name: ${langchain4j.open-ai.chat-model.model-name}
      max-tokens: 100

server:
  port: 8123
  # 部署在 Nginx 等反向代理之后时，用 X-Forwarded-For 还原真实客户端 IP（Tomcat 只信任内网代理，外部伪造无效）
  tomcat:
    remoteip:
      remote-ip-header: X-Forwarded-For
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan:
        - com.leo.aigenweb.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

# 暗房图床（令牌通过环境变量 DARKROOM_TOKEN 注入；云端由网络代理注入真实令牌，这里用占位符即可）
darkroom:
  base-url: https://leorxx.xyz
  token: ${DARKROOM_TOKEN:proxy-injected}

# 工作流
workflow:
  cleanup:
    # 孤儿代码目录清理：工作流每次执行都会生成一个不对应任何应用的代码目录，被删除的应用也会留下目录，定时回收。
    # 只删除数据库里没有对应应用、且修改时间超过 ttl-hours 的 tmp/code_output 下的目录。
    enabled: true
    ttl-hours: 24
    cron: "0 15 * * * ?"
  image-collection:
    # 是否在代码生成工作流中加入“图片收集”步骤（AI 规划图片 + 并发收集素材 + 拼进提示词）。
    # 默认开启。内容图片来源为 Pixabay（需配置 PIXABAY_API_KEY，未配置时该工具会自动跳过）；
    # 如不需要图片收集，可设为 false 关闭。
    enabled: true

# 以下为图片收集所用的外部服务，仅在 workflow.image-collection.enabled=true 时才会用到。
# 密钥通过环境变量注入；未配置（为空）时对应工具会直接跳过，不会发出请求。
# Pixabay 内容图片搜索（免费 API Key，在 https://pixabay.com/api/docs/ 登录后获取）。
# 密钥只能放在 URL 查询参数里，无法由网络代理注入请求头，请通过环境变量 PIXABAY_API_KEY 提供。
pixabay:
  api-key: ${PIXABAY_API_KEY:}
# 阿里云百炼 DashScope（Logo 文生图）
dashscope:
  api-key: ${DASHSCOPE_API_KEY:}
  image-model: wan2.2-t2i-flash
