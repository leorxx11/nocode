# NoCode 监控：Prometheus + Grafana（教程第 13 节）
#
# 部署在 /srv/nocode/monitoring（由 scripts/deploy-nocode.sh monitoring 同步过去），密钥写在同目录的 .env：
#   GRAFANA_ADMIN_PASSWORD=...
#
# 网络：两者都用 host 网络、只监听本机，不改防火墙也不对外开端口
#   Prometheus  127.0.0.1:9090，抓取后端管理端口 127.0.0.1:8126
#   Grafana     不监听 TCP，以 unix socket 提供服务（/srv/nocode/run/grafana/grafana.sock），
#               由 Caddy 转发到 https://nocode.leorxx.xyz/grafana/
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: nocode-prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.1
    container_name: nocode-grafana
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SERVER_PROTOCOL: socket
      GF_SERVER_SOCKET: /run/grafana/grafana.sock
      GF_SERVER_SOCKET_MODE: "0660"
      GF_SERVER_ROOT_URL: https://nocode.leorxx.xyz/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?在 .env 中设置 GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: Asia/Shanghai
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
      - /srv/nocode/run/grafana:/run/grafana

volumes:
  prometheus-data:
  grafana-data:
