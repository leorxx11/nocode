# Prometheus 配置（线上 nocode.leorxx.xyz）
# Prometheus 以 host 网络运行、只监听 127.0.0.1:9090，直接抓取本机后端的管理端口
global:
  scrape_interval: 15s      # 全局抓取间隔
  evaluation_interval: 15s  # 规则评估间隔

scrape_configs:
  # Prometheus 自身
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  # NoCode 后端：管理端口 8126 只监听本机（见 /srv/nocode/application-prod.yaml）
  - job_name: nocode
    metrics_path: /actuator/prometheus
    scrape_interval: 10s
    scrape_timeout: 10s
    static_configs:
      - targets: ['127.0.0.1:8126']
        labels:
          env: prod
